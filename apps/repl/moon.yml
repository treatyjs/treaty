id: repl
language: typescript
platform: node
tags: []
type: application
tasks:
  # Production website build (Vite) for the GitHub Pages deploy. Emits to
  # ../../dist/apps/repl (see vite.config.ts `build.outDir`); the `.treaty` sources
  # compile through the Rust authoring addon via the @treaty/vite plugin (the one
  # Treaty compiler — no TypeScript fallback).
  build:
    command: vite
    args:
      - build
    inputs:
      - src/**/*
      - index.html
      - vite.config.ts
    outputs:
      - ../../dist/apps/repl
  # Headless boot/build assertion for the everything-demo: compiles every Treaty
  # authoring surface through the bundler-plugin seam, then drives the full D2
  # deployment-granularity stack (host + remotes, versioned manifest,
  # build-to-deploy, single-entry rollback, runtime resolution) and asserts.
  everything-demo:
    command: node
    args:
    - $projectRoot/src/everything-demo/everything-demo.smoke.mjs
    deps:
    - treaty-compiler:build
    - treaty-module-federation:build
    - treaty-federation-deploy:build
    - treaty-deploy:build
    inputs:
    - src/everything-demo/**/*
  # `test` runs the everything-demo headless boot/build smoke (same suite as the
  # everything-demo task), so a single `moon run repl:test` gates the full D2 stack.
  test:
    command: node
    args:
    - $projectRoot/src/everything-demo/everything-demo.smoke.mjs
    deps:
    - treaty-compiler:build
    - treaty-module-federation:build
    - treaty-federation-deploy:build
    - treaty-deploy:build
    inputs:
    - src/everything-demo/**/*
  # Type-check the everything-demo Node ESM module + smoke (checkJs, via tsgo).
  typecheck-demo:
    command: tsgo
    args:
    - --noEmit
    - -p
    - $projectRoot/src/everything-demo/tsconfig.check.json
    inputs:
    - src/everything-demo/**/*
  # Lint the everything-demo sources with oxlint.
  lint-demo:
    command: oxlint
    args:
    - -c
    - $workspaceRoot/.oxlintrc.json
    - $projectRoot/src/everything-demo
    inputs:
    - src/everything-demo/**/*
    - $workspaceRoot/.oxlintrc.json
