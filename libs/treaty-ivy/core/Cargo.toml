[package]
name = "treaty_ivy_core"
version = "0.1.0"
edition = "2024"

# Backend-agnostic foundation of Treaty's direct-to-Ivy Angular compiler:
# output IR + emitter/source-map, runtime identifiers, factory, the
# binding-expression lexer/parser/converter, util helpers, and the i18n
# message-id digest primitives. Ported from Angular 22.1 packages/compiler.

[features]
# `oxc` (default) is the reference emit backend: lower output_ast -> oxc_ast -> oxc_codegen.
# It is the ONLY feature that pulls the `oxc_*` crates in — they are `optional` below and
# activated solely by this feature, so `oxc_*` AST types are confined to the `#[cfg(feature = "oxc")]`
# `Lowerer` in `output/emitter.rs`.
# `swc` swaps the four public emit functions to the engine-neutral printer in `output/emitter_swc.rs`
# (see migration/SWC-BACKEND-PLAN.md §3.3 / phase 2). It is additive: with BOTH features on (the
# `--features swc` gate build keeps `oxc` from `default`) the oxc lowering stays compiled and the
# public dispatch routes to the neutral printer, so the default build is byte-for-byte unchanged and
# both backends remain drivable side-by-side. Built `--no-default-features --features swc` the crate
# pulls in ZERO oxc crates. The two backends are gated 1:1 by `tools/backend-parity`.
default = ["oxc"]
oxc = ["dep:oxc_allocator", "dep:oxc_ast", "dep:oxc_codegen", "dep:oxc_span"]
swc = []

[dependencies]
oxc_allocator = { version = "0.133.0", optional = true }
oxc_ast = { version = "0.133.0", optional = true }
oxc_codegen = { version = "0.133.0", optional = true }
oxc_span = { version = "0.133.0", optional = true }
