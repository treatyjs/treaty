[package]
name = "treaty_ivy"
version = "0.1.0"
edition = "2024"

# Treaty's direct-to-Ivy Angular compiler, ported from Angular 22.1 packages/compiler.
# See migration/PORT-ARCHITECTURE.md and migration/render3-specs/.

[features]
# `oxc` (default) is the reference backend. `swc` flips the emit chokepoint to the engine-neutral
# printer (`treaty_ivy_core/swc`); the SOURCE/parse front-end stays on oxc_parser (plan §3.2 / phase 3
# is not in scope here). The default build is byte-for-byte unchanged. Gated 1:1 by
# `tools/backend-parity` (SWC-BACKEND-PLAN.md §3.3 / §4).
default = ["oxc"]
oxc = ["treaty_ivy_core/oxc"]
swc = ["treaty_ivy_core/swc"]

[dependencies]
treaty_ivy_core = { path = "../core", default-features = false }
treaty_ivy_template = { path = "../template" }
treaty_ivy_decorators = { path = "../decorators" }
oxc_allocator = "0.133.0"
oxc_ast = "0.133.0"
oxc_parser = "0.133.0"
oxc_codegen = "0.133.0"
oxc_span = "0.133.0"
