[package]
name = "treaty_packagr"
version = "0.1.0"
edition = "2024"

# treaty_packagr — the Rust-native ng-packagr successor.
# Compiles a library's entries through treaty_ivy + rust_authoring, emits `.d.ts`
# via oxc_isolated_declarations, and produces an Angular Package Format (APF)
# manifest plus per-entry FESM ESM. FESM flattening is a self-contained oxc-based
# internal-module inliner (src/fesm.rs) — no external bundler. See
# migration/ROADMAP-PHASE2 + [[treaty-packagr]].

[dependencies]
treaty_ivy = { path = "../treaty-ivy/facade" }
rust_authoring = { path = "../authoring/rust" }
oxc_allocator = "0.133.0"
oxc_ast = "0.133.0"
oxc_parser = "0.133.0"
oxc_span = "0.133.0"
oxc_isolated_declarations = "0.133.0"
oxc_codegen = "0.133.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust Sass/SCSS compiler for component `styleUrls` preprocessing (the
# ng-packagr `stylesheetExtension: "scss"` path). No JS / dart-sass dependency.
grass = { version = "0.13", default-features = false }
# Glob expansion for asset patterns (`assets/**/*.{svg,png}`).
glob = "0.3"
