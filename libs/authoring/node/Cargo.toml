
[package]
name = 'authoring_node'
version = '0.1.0'
edition = '2021'

[dependencies]
napi = { version = '2.10.2', default-features = false, features = [
	'napi4',
] }
napi-derive = '2.9.3'
treaty_ivy = { path = '../../treaty-ivy/facade' }
rust_authoring = { path = '../../../apps/rust/authoring' }
treaty_runtime = { path = '../../runtime' }
treaty_file_routing = { path = '../../file-routing' }
rayon = '1.10.0'
serde = { version = '1.0', features = ['derive'] }
serde_json = '1.0'

[lib]
crate-type = [
	'cdylib',
]

[build-dependencies]
napi-build = '2.0.1'
