id: vite
language: typescript
platform: node
tags: []
tasks:
  build:
    command: js swc
    args:
    - --outputPath
    - $workspaceRoot/dist/libs/typescript/vite
    - --assets
    - '[]'
    - --main
    - $workspaceRoot/libs/typescript/vite/src/index.ts
    - --tsConfig
    - $workspaceRoot/libs/typescript/vite/tsconfig.lib.json
    outputs:
    - '{options.outputPath}'
  publish:
    command: node tools/scripts/publish.mjs vite {args.ver} {args.tag}
    deps:
    - ~:build
  # Unit suite for the partial-declaration linker. Uses a standalone Jest config (the repo's shared
  # jest.preset.js still references the removed @nx/jest preset after the moon migration); this config
  # mirrors jest.config.ts's SWC transform without that preset dependency.
  test:
    command: js jest --config $workspaceRoot/libs/typescript/vite/jest.standalone.config.cjs
    inputs:
    - 'src/**/*'
    - 'jest.standalone.config.cjs'
    - '.swcrc'
type: library
