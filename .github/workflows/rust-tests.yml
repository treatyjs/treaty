name: 🦀 Rust tests

on:
  push:
    branches: ["master", "migration/v22-oxc133"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: rust-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4

      # The repo pins its toolchain via rust-toolchain.toml (edition 2024); rustup honours it
      # automatically when cargo runs in the repo, installing it on demand.
      - name: 🦀 Cache cargo
        uses: Swatinem/rust-cache@v2

      # The whole workspace. The real-Angular linker integration test
      # (libs/treaty-ivy/facade/tests/link_real_packages.rs) SKIPS cleanly when no
      # node_modules/@angular is present (a fresh CI checkout), so this passes without an npm install.
      - name: Workspace tests
        run: cargo test --workspace

      # libs/file-routing is `exclude`d from the workspace (so the NAPI addon can depend on it by path
      # without a "multiple workspace roots" conflict), which means `--workspace` never runs its ~90
      # tests. Run them explicitly so the file-routing core is covered in CI.
      - name: file-routing crate (excluded from the workspace by design)
        run: cargo test --manifest-path libs/file-routing/Cargo.toml

      # tools/dep-updater is its own standalone workspace (has its own [workspace] table), so it is
      # likewise outside `--workspace`. Gate it here so the dep-updater core is covered too.
      - name: dep-updater crate (standalone workspace)
        run: cargo test --manifest-path tools/dep-updater/Cargo.toml

      # tools/backend-parity is the deterministic (NO-AI) backend-parity harness (see
      # migration/SWC-BACKEND-PLAN.md §4 and migration/BACKEND-PARITY.md). Like dep-updater it is its
      # own standalone workspace, so it is outside `--workspace` and must be gated explicitly. The
      # `parity` subcommand compiles the shared corpus through every wired backend and asserts the
      # emitted Ivy is byte-identical (today: the oxc baseline oxc-vs-oxc; once the swc feature lands,
      # real oxc<->swc cross-backend parity). It exits non-zero on any byte diff.
      - name: backend-parity — oxc baseline + cross-backend parity (standalone workspace)
        run: cargo run --manifest-path tools/backend-parity/Cargo.toml -- parity

      # `drift` re-fingerprints the live corpus against the committed parity baseline (the
      # tripwire artifact, mirroring tools/render3-sync/baseline.json) and exits non-zero when the
      # emitted Ivy for any fixture has moved out from under the baseline, so unreviewed output
      # changes fail the build.
      - name: backend-parity — drift vs committed baseline (standalone workspace)
        run: cargo run --manifest-path tools/backend-parity/Cargo.toml -- drift
