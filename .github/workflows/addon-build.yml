name: Build NAPI Addon

on:
  workflow_dispatch:
  push:
    branches:
      - migration/v22-oxc133

jobs:
  build:
    strategy:
      matrix:
        include:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: macos-latest
            target: aarch64-apple-darwin
          # NOTE: only TRUE host-native targets run on every-push CI (each runner
          # builds its own arch). The cross targets — macos x86_64 (from the arm64
          # runner; nova_vm fails to cross-compile), windows i686, aarch64-pc-windows,
          # and all cross-from-ubuntu linux (aarch64-gnu/musl, x86_64-musl, armv7) —
          # need a cross-linker / zig and belong in a RELEASE workflow with
          # napi --zig, not the merge-gating PR pipeline.
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Pin to the repo's rust-toolchain.toml channel (1.95.0) so the target's std
      # is installed for the SAME toolchain cargo uses. NOTE: dtolnay/rust-toolchain
      # is referenced as @master with a `toolchain:` input for a specific version —
      # `@1.95.0` is NOT a valid action ref (only @stable/@nightly/@master + tagged
      # channels exist), which failed the Setup-Rust step on every target.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}
          components: rust-src

      - name: Install dependencies
        run: bun install

      - name: Build addon
        run: bun run --cwd libs/authoring/node build -- --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: addon-${{ matrix.target }}
          path: libs/authoring/node/*.node
          if-no-files-found: ignore
