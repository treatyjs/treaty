name: Build NAPI Addon

on:
  workflow_dispatch:
  push:
    branches:
      - migration/v22-oxc133

jobs:
  build:
    strategy:
      matrix:
        include:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: windows-latest
            target: i686-pc-windows-msvc
          # NOTE: the cross-from-ubuntu targets (aarch64-unknown-linux-gnu/musl,
          # x86_64-unknown-linux-musl, armv7) + aarch64-pc-windows-msvc need a
          # cross-linker (gcc cross-toolchain / zig) that isn't set up here. They
          # are intentionally NOT built on every-push CI — they belong in a
          # release workflow with napi --zig cross-compilation. Push CI verifies
          # the addon builds on the natively-buildable targets below.
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Pin to the repo's rust-toolchain.toml channel (1.95.0) so the cross
      # target's std is installed for the SAME toolchain cargo uses (the prior
      # @stable installed the target for stable, not 1.95.0 -> "can't find crate
      # for core").
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
          components: rust-src

      - name: Install dependencies
        run: bun install

      - name: Build addon
        run: bun run --cwd libs/authoring/node build -- --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: addon-${{ matrix.target }}
          path: libs/authoring/node/*.node
          if-no-files-found: ignore
